# electron-builder.yml
#
# Basic installer build — no code signing, no auto-update (yet).
#
#   npm run dist       installers for the current platform into release/
#   npm run dist:dir   unpacked app for a quick smoke test
#
# electron-builder rebuilds better-sqlite3 against Electron's ABI before
# packing; the `postdist` npm script rebuilds it back for plain Node so
# `npm run dev` keeps working afterwards.

appId: com.exlibris.app
productName: Ex Libris
copyright: Copyright © Ex Libris

directories:
  output: release
  buildResources: build

# What ships inside the app (production node_modules are added automatically):
#   dist/      the built React UI, served by the embedded Express server
#   server/    the Express + SQLite backend, imported by electron/main.cjs
#   electron/  the shell itself
# Never ship a development database or the encryption secret — user data is
# created fresh in the per-user app data directory.
files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - "!server/exlibris.db*"
  - "!server/.secret"
  - "!**/*.map"

# Native modules (better-sqlite3) can't load from inside an asar archive.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Code signing comes later; don't fail the build looking for an identity.
  identity: null

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: exlibris@localhost
